<!doctype html>
<html lang="tr" data-theme="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Ürün Video Stüdyo — Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b; --bg2:#0e0e12; --panel:#131318; --panel2:#18181f; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#f4f3f1; --muted:#9a99a3; --dim:#6b6a74;
  --acc:#ff7a45; --acc2:#ffb067; --accRGB:255,122,69; --onAcc:var(--onAcc); --sec:#a99bff; --secRGB:120,90,255;
  --accSoft:rgba(var(--accRGB),.12); --accGlow:rgba(var(--accRGB),.35); --btnR:16px; --serif:'Instrument Serif',Georgia,serif;
  --glowA:rgba(var(--accRGB),.10); --glowB:rgba(120,90,255,.06);
  --ctaBg:radial-gradient(120% 140% at 100% 0%,rgba(255,154,90,.5),transparent 55%),linear-gradient(160deg,#2a1810,#160f0c 60%,#100d0c);
  --balBg:linear-gradient(150deg,#1b1714,#121216 55%);
  --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  --r:18px; --r2:24px; --rs:12px;
  --h:'Sora',system-ui,sans-serif; --b:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,var(--glowA),transparent 60%),radial-gradient(700px 500px at -10% 110%,var(--glowB),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--h);font-weight:600;letter-spacing:-.02em;line-height:1.2}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:max(14px,env(safe-area-inset-top)) 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--h);font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc2),var(--acc) 55%,var(--acc));box-shadow:0 6px 20px -6px var(--accGlow),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:16px;height:16px;fill:var(--onAcc);stroke:none}
.credit-pill{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px}
.credit-pill .dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc2),var(--acc));box-shadow:0 0 12px var(--accGlow)}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.top-title{font-family:var(--h);font-weight:600;font-size:15px}
.bnav{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:40;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:space-around;
  background:rgba(20,20,26,.72);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line2);box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--dim);width:60px;transition:color .2s}
.bnav a.on{color:var(--text)}
.bnav a.on svg{stroke:var(--acc)}
.bnav .plus{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;margin-top:-4px;background:linear-gradient(140deg,var(--acc2),var(--acc));color:var(--onAcc);box-shadow:0 10px 28px -8px var(--accGlow),inset 0 1px 0 rgba(255,255,255,.4)}
.bnav .plus svg{stroke:var(--onAcc);stroke-width:2.2;width:22px;height:22px}
body.flow .bnav{display:none}
.view{animation:in .45s var(--ease) both;max-width:1120px;margin:0 auto}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.h1{font-size:26px;margin:4px 0 6px}
.sub{color:var(--muted);font-size:14.5px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h3{font-size:16px}
.sec-h a{font-size:13px;color:var(--muted)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px} .acc{color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.acc{background:var(--accSoft);color:var(--acc2);border-color:rgba(var(--accRGB),.25)}
.tag.ok{background:rgba(74,222,128,.1);color:var(--ok);border-color:rgba(74,222,128,.2)}
.tag.err{background:rgba(248,113,113,.1);color:var(--err);border-color:rgba(248,113,113,.2)}
.tag.ornek{background:rgba(251,191,36,.08);color:#f5c96a;border-color:rgba(251,191,36,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:var(--btnR);font-weight:600;font-size:15px;transition:transform .15s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(140deg,var(--acc2),var(--acc) 60%);color:var(--onAcc);box-shadow:0 12px 30px -12px var(--accGlow),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.p:hover{box-shadow:0 16px 40px -12px var(--accGlow),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.p svg{stroke:var(--onAcc)}
.btn.s{background:var(--panel2);border:1px solid var(--line2)}
.btn.s:hover{background:#1e1e26}
.btn.g{color:var(--muted);height:44px;padding:0 14px}
.btn.w{width:100%}
.btn.sm{height:40px;padding:0 14px;border-radius:12px;font-size:13.5px}
.hero-grid{display:grid;gap:12px}
.bal{position:relative;overflow:hidden;padding:20px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--balBg)}
.bal::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accRGB),.28),transparent 65%);pointer-events:none}
.bal>*{position:relative;z-index:1}
.bal .num{font-family:var(--h);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;margin:10px 0 4px}
.bal .num small{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin:14px 0 8px}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.cta{position:relative;overflow:hidden;border-radius:var(--r2);padding:22px;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--ctaBg);border:1px solid rgba(var(--accRGB),.25);cursor:pointer;transition:transform .25s var(--ease)}
.cta:hover{transform:translateY(-2px)}
.cta h2{font-size:24px;max-width:15ch}
.cta p{color:rgba(255,255,255,.72);font-size:14px;margin:6px 0 16px;max-width:32ch}
.cta .orb{position:absolute;right:18px;top:18px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc2),var(--acc));box-shadow:0 14px 40px -10px var(--accGlow)}
.cta .orb svg{stroke:var(--onAcc);width:26px;height:26px;stroke-width:2.2}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick a{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:500;font-size:14px}
.quick a .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);flex:none}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.vthumb{scroll-snap-align:start;cursor:pointer;min-width:0}
.vthumb .fr{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;border:1px solid var(--line);transition:transform .25s var(--ease)}
.vthumb:hover .fr{transform:translateY(-3px)}
.vthumb .fr svg.art{position:absolute;inset:0;width:100%;height:100%}
.vthumb .fr .ov{position:absolute;inset:auto 0 0 0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;justify-content:space-between;align-items:end;font-size:11px;font-weight:600}
.vthumb .fr .st{position:absolute;top:8px;left:8px}
.vthumb h4{font-family:var(--b);font-size:13px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vthumb p{font-size:11.5px;color:var(--dim)}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(120,90,255,.12);color:#a99bff;flex:none}
.lower{display:grid;gap:12px}
.steps{display:flex;gap:6px;margin:2px 0 18px}
.steps i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.steps i.on::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.step-lbl{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);gap:4px}
.seg button{flex:1;height:40px;border-radius:10px;font-weight:500;font-size:13.5px;color:var(--muted);transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 4px 14px -6px rgba(0,0,0,.6);border-color:var(--line2)}
.seg button svg{width:17px;height:17px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.inp,textarea.inp{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:13px 14px;outline:none;transition:border .2s,box-shadow .2s;font-size:15px}
textarea.inp{resize:vertical;min-height:84px;line-height:1.55}
.inp:focus{border-color:rgba(var(--accRGB),.55);box-shadow:0 0 0 4px rgba(var(--accRGB),.12)}
.linkbox{display:flex;gap:8px;padding:6px;border-radius:18px;background:var(--bg2);border:1px solid var(--line2);transition:border .2s,box-shadow .2s}
.linkbox:focus-within{border-color:rgba(var(--accRGB),.55);box-shadow:0 0 0 4px rgba(var(--accRGB),.12)}
.linkbox input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0 10px;font-size:15px}
.sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.src{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 10px 6px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.src b{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10px;color:#fff}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:34px 18px;border-radius:var(--r);border:1.5px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.02);cursor:pointer;transition:all .2s}
.drop:hover{border-color:var(--acc);background:var(--accSoft)}
.drop .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);margin-bottom:4px}
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.imgs .im{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);cursor:pointer;transition:border .2s}
.imgs .im.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accRGB),.18)}
.imgs .im svg.art,.imgs .im img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .im .badge{position:absolute;left:5px;bottom:5px;font-size:9.5px;font-weight:700;background:var(--acc);color:var(--onAcc);padding:2px 6px;border-radius:6px}
.imgs .add{display:grid;place-items:center;border-style:dashed;color:var(--dim)}
.shimmer{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border-radius:12px}
.shimmer::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.ok-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);font-weight:500;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{position:relative;border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;transition:transform .2s var(--ease),border .2s,box-shadow .2s;text-align:left;display:block;width:100%}
.scard:hover{transform:translateY(-2px)}
.scard.on{border-color:var(--acc);box-shadow:0 0 0 4px rgba(var(--accRGB),.12),0 20px 40px -20px var(--accGlow)}
.scard .pv{position:relative;aspect-ratio:4/3;overflow:hidden}
.scard .pv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(19,19,24,.95))}
.scard .pv .ani{position:absolute;inset:-12%;animation:drift 8s ease-in-out infinite alternate}
.scard .pv .ani svg{width:100%;height:100%;display:block}
@keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.06)}}
.scard .pv .lbl{position:absolute;z-index:2;left:10px;top:10px}
.scard .bd{padding:10px 12px 13px}
.scard h4{font-size:14.5px}
.scard p{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.scard .chk{position:absolute;z-index:3;right:10px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.35);transition:all .2s}
.scard.on .chk{background:var(--acc);border-color:var(--acc)}
.scard .chk svg{width:13px;height:13px;stroke-width:3;stroke:transparent}
.scard.on .chk svg{stroke:var(--onAcc)}
.sgrid .brief{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);color:var(--muted);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accSoft);border-color:rgba(var(--accRGB),.45);color:var(--text)}
.set-grid{display:grid;gap:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;text-align:left;padding:14px;border-radius:16px;background:var(--bg2);border:1.5px solid var(--line);transition:all .2s var(--ease)}
.mcard.on{border-color:var(--acc);background:linear-gradient(180deg,rgba(var(--accRGB),.12),rgba(var(--accRGB),.02));box-shadow:0 0 0 4px rgba(var(--accRGB),.10)}
.mcard .lvl{display:flex;gap:3px;margin-bottom:10px}
.mcard .lvl i{width:14px;height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
.mcard .lvl i.f{background:var(--acc)}
.mcard h4{font-size:15px}
.mcard .nm{font-size:12px;color:var(--muted);margin-top:1px}
.mcard .pr{margin-top:10px;font-size:12px;color:var(--dim)}
.mcard .pr b{color:var(--text);font-weight:600;font-size:13px}
.setc{padding:16px}
.setc .lab{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.setc .lab h4{font-family:var(--b);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.setc .lab h4 svg{width:18px;height:18px;color:var(--dim)}
.val{font-family:var(--h);font-weight:600;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--acc) 0 var(--p,40%),rgba(255,255,255,.1) var(--p,40%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-9px;background:#fff;box-shadow:0 0 0 5px rgba(var(--accRGB),.25),0 4px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(var(--accRGB),.25)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:2px}
.ar{display:inline-block;border:1.6px solid currentColor;border-radius:3px}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.voice{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);text-align:left;transition:all .2s;min-width:0}
.voice.on{border-color:var(--acc);background:var(--accSoft)}
.voice .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--onAcc)}
.voice b{display:block;font-size:13.5px;font-weight:600}
.voice>span:nth-child(2){flex:1;min-width:0}
.voice span span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.voice{padding:9px 8px;gap:8px}.voice .av{width:30px;height:30px}.voice .pl{width:24px;height:24px}}
.voice .pl{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.voice .pl svg{width:11px;height:11px;fill:currentColor;stroke:none}
.tgl{position:relative;width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .25s;flex:none}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tgl.on{background:var(--acc)}
.tgl.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:4px;padding:4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2)}
.stepper button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2)}
.stepper button svg{width:16px;height:16px}
.stepper b{width:30px;text-align:center;font-family:var(--h);font-size:17px}
.smart{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.15);font-size:13px;color:#bfe9cc;margin-bottom:14px}
.smart svg{color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(9,9,11,.92) 30%)}
.bar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:22px;background:rgba(22,22,28,.85);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line2);box-shadow:0 20px 50px -18px rgba(0,0,0,.9)}
.bar .pz{flex:1;min-width:0}
.bar .pz b{font-family:var(--h);font-size:20px;font-weight:600;letter-spacing:-.02em;display:inline-block}
.bar .pz b.bump{animation:bump .35s var(--ease)}
@keyframes bump{40%{transform:scale(1.12);color:var(--acc2)}}
.bar .pz .ln{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{height:50px;padding:0 18px}
.summary{display:none}
.scene{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px}
.scene .th{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;border:1px solid var(--line);align-self:start}
.scene .th svg{width:100%;height:100%;display:block}
.scene .th span{position:absolute;left:4px;top:4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:5px}
.scene .tm{font-size:11px;font-weight:700;color:var(--acc2);letter-spacing:.04em}
.scene h4{font-size:14.5px;margin:2px 0 8px}
.scene .vo{width:calc(100% + 10px);background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 8px;margin-left:-8px;resize:none;line-height:1.5;font-size:14.5px;color:var(--text);outline:none;transition:all .2s;field-sizing:content}
.scene .vo:hover{background:rgba(255,255,255,.03);border-color:var(--line)}
.scene .vo:focus{background:var(--bg2);border-color:rgba(var(--accRGB),.5)}
.scene .vis{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:4px}
.scene .vis svg{width:15px;height:15px;margin-top:2px;color:var(--dim)}
.scene .vis span{outline:none}
.vo-lbl{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.vo-lbl svg{width:12px;height:12px}
.vprev{display:flex;gap:14px;align-items:center;padding:14px}
.vplay{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc2),var(--acc));box-shadow:0 8px 20px -8px var(--accGlow)}
.vplay svg{width:16px;height:16px;fill:var(--onAcc);margin-left:2px}
.wave{display:flex;align-items:center;gap:3px;height:28px;margin-top:6px}
.wave i{flex:1;border-radius:3px;background:rgba(255,255,255,.18)}
.wave i:nth-child(-n+12){background:var(--acc)}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:12px 14px;border-radius:14px;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.14)}
.lock svg{color:var(--warn);width:18px;height:18px;margin-top:1px}
.prod{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.ring{position:relative;width:210px;height:210px;margin:14px 0 20px}
.ring svg.rg{width:100%;height:100%;transform:rotate(-90deg);position:relative;z-index:1}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.ring .ctr b{font-family:var(--h);font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ring .ctr span{font-size:12.5px;color:var(--muted);margin-top:6px}
.ring::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accRGB),.2),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.6}}
.tl{width:100%;max-width:440px;text-align:left;padding:6px 16px}
.tl .it{display:flex;gap:14px;padding:11px 0;position:relative}
.tl .it:not(:last-child)::after{content:"";position:absolute;left:13px;top:40px;bottom:-10px;width:2px;background:var(--line2)}
.tl .it.done:not(:last-child)::after{background:linear-gradient(var(--acc),rgba(var(--accRGB),.3))}
.tl .bub{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--bg);flex:none;position:relative;z-index:1;transition:all .3s}
.tl .it.done .bub{background:var(--acc);border-color:var(--acc)}
.tl .it.done .bub svg{stroke:var(--onAcc);stroke-width:3;width:14px;height:14px}
.tl .it.now .bub{border-color:var(--acc)}
.tl .it.now .bub::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
.tl .it b{display:block;font-size:14.5px;font-weight:600}
.tl .it span{font-size:12.5px;color:var(--muted)}
.tl .it:not(.done):not(.now) b{color:var(--dim)}
.notice{display:flex;gap:12px;align-items:center;text-align:left;max-width:440px;width:100%;margin-top:12px}
.notice .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(120,90,255,.12);color:#a99bff;flex:none}
.del{display:grid;gap:22px}
.phone{position:relative;width:min(100%,290px);margin:0 auto;aspect-ratio:9/16;border-radius:28px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 40px 80px -30px rgba(var(--accRGB),.4),0 30px 60px -20px rgba(0,0,0,.9)}
.phone svg.art{position:absolute;inset:0;width:100%;height:100%;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translateY(-3%)}}
.phone .cap{position:absolute;left:16px;right:16px;bottom:58px;text-align:center;font-family:var(--h);font-weight:700;font-size:18px;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.phone .cap em{white-space:nowrap;font-style:normal;background:var(--acc);color:var(--onAcc);padding:0 6px;border-radius:6px;text-shadow:none}
.phone .ctl{position:absolute;left:14px;right:14px;bottom:18px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600}
.phone .ctl .pb{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.phone .ctl .pb i{display:block;height:100%;width:0;background:#fff;animation:prog 15s linear infinite}
@keyframes prog{to{width:100%}}
.phone .play{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3)}
.phone .play svg{width:22px;height:22px;fill:#fff;stroke:none;margin-left:3px}
.phone .brandmark{position:absolute;top:14px;left:14px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.acts{display:grid;gap:10px}
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.ig{background:linear-gradient(135deg,#f9a534,#ee2a7b 50%,#6228d7);border:0;color:#fff}
.btn.tt{background:#0b0b0d;border:1px solid #2c2c33;color:#fff;box-shadow:inset 2px 0 0 #25f4ee,inset -2px 0 0 #fe2c55}
.vers{display:flex;gap:8px}
.vers .v{width:52px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);cursor:pointer;position:relative}
.vers .v.on{border-color:var(--acc)}
.vers .v svg{width:100%;height:100%;display:block}
.vers .v span{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:700}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta div{padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.meta span{display:block;font-size:11px;color:var(--dim)}
.meta b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fail{text-align:center;max-width:460px;margin:20px auto 0}
.fail .big{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:var(--err)}
.fail .big svg{width:36px;height:36px}
.refund{display:flex;align-items:center;gap:14px;text-align:left;margin:22px 0 14px;padding:16px;border-radius:18px;background:linear-gradient(150deg,rgba(74,222,128,.10),rgba(74,222,128,.03));border:1px solid rgba(74,222,128,.22)}
.refund .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(74,222,128,.15);color:var(--ok);flex:none}
.refund b{font-family:var(--h);font-size:17px}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.plans{display:grid;gap:12px}
.plan{position:relative;padding:20px;border-radius:var(--r2);background:var(--panel);border:1.5px solid var(--line)}
.plan.pop{border-color:rgba(var(--accRGB),.5);background:linear-gradient(170deg,rgba(var(--accRGB),.12),rgba(var(--accRGB),.02) 50%),var(--panel);box-shadow:0 30px 60px -30px var(--accGlow)}
.plan .pp{font-family:var(--h);font-size:30px;font-weight:600;letter-spacing:-.03em;margin:10px 0 2px}
.plan .pp small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.plan ul{list-style:none;margin:14px 0 18px;display:grid;gap:8px}
.plan li{display:flex;gap:8px;font-size:13.5px;color:#d6d5db}
.plan li svg{width:17px;height:17px;color:var(--acc);stroke-width:2.4}
.plan .cur{position:absolute;right:16px;top:18px}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pack{padding:14px 8px;border-radius:18px;background:var(--panel);border:1.5px solid var(--line);text-align:center;transition:all .2s}
.pack:hover,.pack.on{border-color:var(--acc)}
.pack .cn{font-family:var(--h);font-size:22px;font-weight:600}
.pack .tl2{font-size:14px;font-weight:600;margin-top:6px}
.pack .bonus{font-size:10.5px;font-weight:700;color:var(--ok);margin-top:4px;min-height:15px}
.pay{display:grid;gap:12px}
.payrow{display:flex;gap:12px;align-items:center}
.payrow .ic{width:44px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);flex:none;font-weight:800;font-size:10.5px}
.ledger .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ledger .li:last-child{border:0}
.ledger .li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ledger .li .ic svg{width:16px;height:16px}
.ledger .li b{font-size:13.5px;font-weight:500;display:block}
.ledger .li span{font-size:11.5px;color:var(--dim)}
.ledger .li .amt{margin-left:auto;font-weight:600;font-family:var(--h);font-size:14px;white-space:nowrap}
.dev{position:fixed;z-index:60;left:0;top:50%;transform:translateY(-50%)}
.dev>button{width:22px;height:46px;border-radius:0 11px 11px 0;border-left:0!important;display:grid;place-items:center;background:rgba(30,30,38,.7);border:1px solid var(--line2);backdrop-filter:blur(10px);color:var(--dim);opacity:.55;transition:opacity .2s}
.dev>button:hover,.dev.open>button{opacity:1}
.dev>button svg{width:16px;height:16px}
.dev .menu{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:230px;padding:8px;border-radius:16px;background:rgba(20,20,26,.97);backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:0 30px 60px -20px #000;display:none}
.dev.open .menu{display:block}
.dev .menu p{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px}
.dev .menu a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--muted)}
.dev .menu a:hover,.dev .menu a.on{background:rgba(255,255,255,.06);color:var(--text)}
.dev .menu a i{font-style:normal;color:var(--dim);font-size:11px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;z-index:80;padding:11px 16px;border-radius:14px;background:#22222a;border:1px solid var(--line2);font-size:13.5px;font-weight:500;transition:all .3s var(--ease);pointer-events:none;box-shadow:0 20px 40px -10px #000;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== THEMES ===== */
html[data-theme=lime]{--bg:#0b0b0c;--bg2:#0f0f11;--panel:#141416;--panel2:#1a1a1d;--text:#ffffff;--muted:#a3a3a8;--dim:#6e6e74;
 --acc:#c6f432;--acc2:#dcfb7c;--accRGB:198,244,50;--onAcc:#0b0b0c;--sec:#ffffff;--secRGB:255,255,255;
 --glowA:rgba(198,244,50,.09);--glowB:rgba(255,255,255,.03);
 --ctaBg:radial-gradient(90% 120% at 50% 120%,rgba(198,244,50,.42),transparent 60%),repeating-linear-gradient(90deg,rgba(198,244,50,.07) 0 1px,transparent 1px 7px),linear-gradient(180deg,#0f100c,#0b0b0c);
 --balBg:linear-gradient(150deg,#16170f,#111113 55%)}
html[data-theme=cobalt]{--bg:#010102;--bg2:#07070b;--panel:#0d0c14;--panel2:#13121c;--text:#f6f4ff;--muted:#a59fbe;--dim:#6c6785;--line:rgba(173,150,241,.10);--line2:rgba(173,150,241,.17);
 --acc:#58f6b1;--acc2:#a3fbd4;--accRGB:88,246,177;--onAcc:#02130b;--sec:#ad96f1;--secRGB:173,150,241;
 --glowA:rgba(173,150,241,.16);--glowB:rgba(88,246,177,.06);
 --ctaBg:radial-gradient(70% 60% at 85% 10%,rgba(88,246,177,.28),transparent 60%),radial-gradient(120% 120% at 20% 0%,rgba(173,150,241,.75),transparent 60%),linear-gradient(170deg,#2b2160,#120d2a 55%,#05040b);
 --balBg:linear-gradient(150deg,#17132b,#0c0b14 60%)}
html[data-theme=glass]{--bg:#08090b;--bg2:#0d0f12;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);--text:#f2f6f7;--muted:#9aa5aa;--dim:#67727a;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
 --acc:#7cf5d4;--acc2:#d2fff2;--accRGB:124,245,212;--onAcc:#03201a;--sec:#c7d6ff;--secRGB:170,190,255;--btnR:999px;
 --glowA:rgba(150,190,255,.10);--glowB:rgba(124,245,212,.07);
 --ctaBg:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 45%),linear-gradient(200deg,#2a3138,#12161a 55%,#090b0d);
 --balBg:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.02))}
html[data-theme=glass] .card,html[data-theme=glass] .bal,html[data-theme=glass] .quick a,html[data-theme=glass] .plan,html[data-theme=glass] .mcard{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
html[data-theme=glass] .btn.p{background:linear-gradient(180deg,rgba(210,255,242,.95),rgba(124,245,212,.9));box-shadow:0 0 0 1px rgba(124,245,212,.6),0 0 26px rgba(124,245,212,.45),0 0 60px rgba(124,245,212,.18),inset 0 1px 0 #fff}
html[data-theme=glass] .bnav .plus{border-radius:50%;box-shadow:0 0 24px rgba(124,245,212,.5),inset 0 1px 0 #fff}
html[data-theme=lime] .btn.p{background:var(--acc);box-shadow:0 0 0 1px rgba(198,244,50,.5),0 10px 34px -8px rgba(198,244,50,.55)}
html[data-theme=lime] .bnav .plus,html[data-theme=lime] .logo{background:var(--acc)}
html[data-theme=cobalt] .btn.p{background:linear-gradient(140deg,#a3fbd4,#58f6b1);box-shadow:0 0 0 1px rgba(88,246,177,.45),0 10px 34px -8px rgba(88,246,177,.55)}
html[data-theme=cobalt] .tip .ic,html[data-theme=cobalt] .notice .ic{background:rgba(173,150,241,.14);color:#c9b9ff}
html[data-theme=cobalt] .h1 em,html[data-theme=cobalt] .cta h2 em{color:var(--sec)}
.h1 em,.cta h2 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--acc);font-size:1.12em}
html[data-theme=glass] .h1 em,html[data-theme=glass] .cta h2 em{background:linear-gradient(100deg,#fff,#b9c7d6 40%,#7cf5d4 70%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* hero decorative visual (pure CSS/SVG) */
.hero-vis{position:absolute;right:-10px;top:-6px;width:58%;height:66%;pointer-events:none}
.cta .hv-txt{position:relative;z-index:2}
.sph{position:absolute;border-radius:50%;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 4%,rgba(255,255,255,.35) 10%,transparent 32%),
  radial-gradient(circle at 70% 78%,rgba(var(--accRGB),.55),transparent 55%),
  conic-gradient(from 210deg,rgba(var(--secRGB),.55),rgba(var(--accRGB),.45),rgba(255,180,220,.35),rgba(140,200,255,.5),rgba(var(--secRGB),.55));
 box-shadow:inset -10px -14px 30px rgba(0,0,0,.45),inset 6px 8px 20px rgba(255,255,255,.25),0 20px 40px -10px rgba(0,0,0,.6),0 0 40px -6px rgba(var(--accRGB),.35);
 animation:float 7s ease-in-out infinite}
.sph::after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(255,255,255,.35);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg)}
.sph.a{width:46%;aspect-ratio:1;right:14%;top:14%}
.sph.b{width:20%;aspect-ratio:1;right:4%;top:58%;animation-delay:-2s;animation-duration:9s}
.sph.c{width:13%;aspect-ratio:1;right:62%;top:10%;animation-delay:-4s;animation-duration:8s;opacity:.9}
.ring3d{position:absolute;width:62%;aspect-ratio:1;right:6%;top:4%;border-radius:50%;border:2px solid rgba(255,255,255,.55);border-right-color:rgba(255,255,255,.1);border-bottom-color:rgba(255,255,255,.12);transform:rotateX(68deg) rotateZ(-18deg);box-shadow:0 0 20px rgba(255,255,255,.15);animation:spin 14s linear infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotateX(68deg) rotateZ(342deg)}}
.chrome{position:absolute;left:-10%;bottom:-14%;width:120%;height:42%;opacity:.9;pointer-events:none}
html[data-theme=glass] .hero-vis{width:64%}
html[data-theme=glass]{--chromeOn:block}
html[data-theme=lime] .sph{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 4%,rgba(255,255,255,.3) 10%,transparent 30%),radial-gradient(circle at 60% 70%,rgba(198,244,50,.85),rgba(60,80,10,.9) 70%,#0b0b0c);box-shadow:inset -10px -14px 30px rgba(0,0,0,.6),0 0 60px -4px rgba(198,244,50,.55)}
html[data-theme=lime] .ring3d{border-color:rgba(198,244,50,.6);border-right-color:rgba(198,244,50,.08);border-bottom-color:rgba(198,244,50,.1)}

/* theme picker */
.tpick{position:relative}
.tbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.tbtn i{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--acc) 0 33%,var(--sec) 0 66%,#fff 0);box-shadow:0 0 10px rgba(var(--accRGB),.5)}
.tmenu{position:absolute;right:0;top:48px;z-index:70;width:240px;padding:8px;border-radius:18px;background:rgba(18,18,22,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -20px #000;display:none}
.tpick.open .tmenu{display:block}
.tmenu p{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#77777f;padding:6px 8px}
.tmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:11px;font-size:13.5px;text-align:left;color:#ddd}
.tmenu button:hover,.tmenu button.on{background:rgba(255,255,255,.07)}
.tmenu .sw{display:flex}
.tmenu .sw b{width:16px;height:16px;border-radius:50%;margin-left:-5px;border:2px solid #121216}
.tmenu .sw b:first-child{margin-left:0}
.tmenu small{display:block;font-size:11px;color:#88888f}
.top .right{display:flex;gap:8px;align-items:center}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;width:248px;flex:none;padding:22px 16px;border-right:1px solid var(--line);background:rgba(12,12,15,.6);backdrop-filter:blur(20px)}
  .side .brand{padding:4px 8px 26px}
  .side nav{display:grid;gap:3px}

  document.getElementById('side').innerHTML=`<a class="brand" href="#/panel">${LOGO}Ürün Video Stüdyo</a>
   <a class="btn p w newb" href="#/urun">${ic('plus')}Yeni video</a>
   <nav>${NAV.filter(n=>n[0]!=='urun').map(n=>`<a href="#/${n[0]}" class="${active===n[0]?'on':''}">${ic(n[2])}${n[1]==='Hesap'?'Hesabım':n[1]}</a>`).join('')}</nav>
   <div class="foot"><div class="mini"><div class="row between"><span class="small muted">Pro plan</span><span class="tag acc">Aktif</span></div>
   <div style="font-family:var(--h);font-size:22px;font-weight:600;margin:8px 0 2px">${fmt(S.balance)} <span class="small muted" style="font-family:var(--b);font-weight:500">kredi</span></div>
   <div class="meter" style="margin:10px 0 6px"><i style="width:62%"></i></div><div class="small dim">Yenilenme: 1 Aralık</div></div>
   <div class="row" style="margin-top:14px;padding:0 6px"><div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#3a3a46,#22222a);display:grid;place-items:center;font-weight:600;font-size:12px;border:1px solid var(--line2)">HG</div><div><div style="font-size:13.5px;font-weight:600">Harun Gök</div><div class="small dim">Gök Seramik</div></div></div></div>`;
  document.getElementById('bnav').innerHTML=NAV.map(n=>n[0]==='urun'?`<a href="#/urun" aria-label="Yeni video"><span class="plus">${ic('plus')}</span></a>`:`<a href="#/${n[0]}" class="${active===n[0]?'on':''}">${ic(n[2])}${n[1]}</a>`).join('');
  document.getElementById('devmenu').innerHTML='<p>Prototip ekranları</p>'+SCREENS.map(s=>`<a href="#/${s[0]}" class="${r===s[0]?'on':''}">${s[1]}<i>${s[2]}</i></a>`).join('')+'<p style="margin-top:6px">Tema</p>'+THEMES.map(t=>`<a href="javascript:void 0" data-a="theme" data-v="${t.id}" class="${document.documentElement.dataset.theme===t.id?'on':''}">${t.n}<i style="display:flex;gap:3px">${t.sw.map(c=>`<b style="width:9px;height:9px;border-radius:50%;background:${c};border:1px solid #333"></b>`).join('')}</i></a>`).join('');
  document.body.classList.toggle('flow',FLOW.includes(r));
}
function topbar(title,backTo){
  const right=`<div class="right">${themePicker()}<a class="credit-pill" href="#/kredi"><span class="dot"></span>${fmt(S.balance)}</a></div>`;
  if(!title) return `<a class="brand" href="#/panel">${LOGO}Ürün Video Stüdyo</a><span style="flex:1"></span>${right}`;
  return `<a class="back" href="#/${backTo}" aria-label="Geri">${ic('back')}</a><div class="top-title">${title}</div>${right}`;
}
const steps=i=>`<div class="step-lbl">Adım ${i+1} / 4</div><div class="steps">${[0,1,2,3].map(k=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;
function bar(h,sum){document.getElementById('bar').innerHTML=h?`<div class="bar ${sum?'has-sum':''}"><div class="in">${h}</div></div>`:''}
const V={};
function thumb(v){
 const st=v.st==='ok'?'':v.st==='run'?`<span class="st tag acc">Üretiliyor</span>`:`<span class="st tag err">İade edildi</span>`;
 return `<div class="vthumb" data-a="go" data-v="${v.st==='err'?'hata':v.st==='run'?'uretim':'teslim'}"><div class="fr">${art(v.k,v.p)}${st}<div class="ov"><span>${v.dur}</span><span style="opacity:.8">${v.s}</span></div></div><h4>${v.t}</h4><p>${v.when}</p></div>`;
}

V.urun=()=>{
 const linkTab=`
  <div class="linkbox"><input id="link" placeholder="Ürün linkini yapıştır" value="${esc(S.link)}" inputmode="url"><button class="btn sm s" data-a="paste">${ic('paste')}Yapıştır</button></div>
  <div class="sources">${[['Trendyol','#f27a1a','T'],['Etsy','#f1641e','E'],['Instagram','linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)','I'],['Hepsiburada','#ff6000','H'],['Shopier','#4c5bd4','S']].map(s=>`<span class="src"><b style="background:${s[1]}">${s[2]}</b>${s[0]}</span>`).join('')}</div>
  <button class="btn s w" style="margin-top:14px" data-a="fetch">${ic('wand')}Bilgileri otomatik çek</button>`;
 const fotoTab=`
  <label class="drop" for="file"><span class="ic">${ic('up')}</span><b>Fotoğrafları buraya bırak</b><span class="small muted">veya galeriden seç • en fazla 6 fotoğraf</span></label>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <button class="btn g w" data-a="demoup" style="margin-top:6px">Örnek fotoğraflarla dene</button>
  <p class="small dim" style="margin-top:6px;text-align:center">İpucu: Açık renk zeminde, gün ışığında çekilmiş fotoğraflar en iyi sonucu verir.</p>`;
 let prev='';
 if(S.fetching) prev=`<div class="card" style="margin-top:16px"><div class="shimmer" style="height:16px;width:55%"></div><div class="imgs" style="margin-top:14px">${'<div class="shimmer" style="aspect-ratio:1"></div>'.repeat(4)}</div><div class="shimmer" style="height:48px;margin-top:14px"></div><div class="shimmer" style="height:84px;margin-top:12px"></div></div>`;
 else if(S.fetched||S.uploads.length) prev=preview();
 const can=S.fetched||S.uploads.length;
 bar(`<div class="pz"><span class="ln">Adım 1 • Ürün</span><b style="font-size:15px">${can?'Ürün hazır ✓':'Link veya fotoğraf ekle'}</b></div><a class="btn p" href="#/stil" style="${can?'':'opacity:.4;pointer-events:none'}">Stil seç ${ic('chev')}</a>`);
 return {top:topbar('Yeni video','panel'),html:`<div class="narrow">${steps(0)}
  <h1 class="h1">Hangi ürünün <em>videosunu</em> yapalım?</h1>
  <p class="sub">Linki yapıştır; başlığı, açıklamayı ve fotoğrafları biz çekelim. İstersen kendi fotoğraflarını yükle.</p>
  <div class="seg" style="margin:20px 0 14px"><button class="${S.tab==='link'?'on':''}" data-a="tab" data-v="link">${ic('link')}Ürün linki</button><button class="${S.tab==='foto'?'on':''}" data-a="tab" data-v="foto">${ic('img')}Fotoğraf yükle</button></div>
  ${S.tab==='link'?linkTab:fotoTab}
  ${prev}</div>`};
};
function preview(){
 const imgs = S.uploads.length? S.uploads.map((u,i)=>`<div class="im ${S.img===i?'on':''}" data-a="img" data-v="${i}">${u.startsWith('data:')?`<img src="${u}" alt="">`:art('kupa',u,'sq')}${S.img===i?'<span class="badge">KAPAK</span>':''}</div>`).join('')
  : [['kupa','ocean'],['kupa','sand'],['kupa','sage']].map((a,i)=>`<div class="im ${S.img===i?'on':''}" data-a="img" data-v="${i}">${art(a[0],a[1],'sq')}${S.img===i?'<span class="badge">KAPAK</span>':''}</div>`).join('');
 return `<div class="card" style="margin-top:16px;animation:in .4s var(--ease)">
  <div class="ok-line">${ic('check')} ${S.uploads.length?S.uploads.length+' fotoğraf eklendi':S.product.src+"'dan bilgiler çekildi"} — kontrol et, istersen düzelt</div>
  <div class="imgs">${imgs}<label class="im add" for="file2">${ic('plus')}</label></div><input type="file" id="file2" accept="image/*" multiple hidden>
  <label class="field"><span>Ürün adı</span><input class="inp" data-m="product.title" value="${esc(S.product.title)}"></label>
  <label class="field"><span>Açıklama</span><textarea class="inp" data-m="product.desc" rows="3">${esc(S.product.desc)}</textarea></label>
  <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:10px"><label class="field"><span>Fiyat (₺)</span><input class="inp" data-m="product.price" value="${esc(S.product.price)}"></label><label class="field"><span>Öne çıkan özellik</span><input class="inp" value="El yapımı, tek parça"></label></div>
 </div>`;
}

V.ayarlar=()=>{

 const c=price();
 const seg=(key,opts)=>`<div class="seg">${opts.map(o=>`<button class="${S[key]===o[0]?'on':''}" data-a="set" data-k="${key}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
 const pct=((S.dur-4)/26*100).toFixed(1)+'%';
 const sum=`<div class="card summary"><div class="eyebrow">Özet</div>

   ${[['Model',m.name],['Süre',S.dur+' saniye'],['Kalite',S.res+' • '+S.ar],['Dil',S.lang==='tr'?'Türkçe':'İngilizce'],['Ses',VOICES.find(v=>v.id===S.voice).n],['Altyazı • Müzik',(S.subs?'Açık':'Kapalı')+' • '+({yok:'Yok',enerjik:'Enerjik',sakin:'Sakin',luks:'Lüks'})[S.music]],['Versiyon',S.ver+' adet']].map(r=>`<div class="row between small" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="dim">${r[0]}</span><span>${r[1]}</span></div>`).join('')}
   <div class="row between" style="margin:16px 0 4px"><span class="muted small">Toplam</span><span class="tag ornek">Örnek fiyat</span></div>
   <div style="font-family:var(--h);font-size:34px;font-weight:600;letter-spacing:-.03em" id="sumc">${c} <span style="font-size:15px;color:var(--muted);font-weight:500">kredi</span></div>
   <div class="small dim" style="margin-bottom:16px">≈ ₺${tl(c)} • Bakiyen: ${fmt(S.balance)} kredi</div>

   <p class="small dim" style="margin-top:10px;text-align:center">Senaryo ücretsiz. Kredi sadece onaylayınca bloke edilir.</p></div>`;
 bar(`<div class="pz"><b id="barc">${c} kredi</b> <span class="tag ornek" style="vertical-align:4px;margin-left:2px">örnek</span><span class="ln" id="barl">${m.tier} • ${S.dur} sn • ${S.res}${S.ver>1?' • '+S.ver+' versiyon':''}</span></div><a class="btn p" href="#/senaryo">Senaryoyu oluştur</a>`,1);
 return {top:topbar('Ayarlar','stil'),html:`<div class="split"><div>${steps(2)}
  <h1 class="h1">Ayarları yap, <em>fiyatı gör</em></h1>
  <p class="sub">Her değişiklikte fiyat anında güncellenir.</p>

   <div class="mgrid">${MODELS.map(x=>`<button class="mcard ${S.model===x.id?'on':''}" data-a="set" data-k="model" data-v="${x.id}"><div class="lvl">${[1,2,3,4].map(k=>`<i class="${k<=x.lv?'f':''}"></i>`).join('')}</div><h4>${x.tier}</h4><div class="nm">${x.name}</div><div class="pr"><b>${x.ps.toLocaleString('tr-TR')}</b> kredi / sn</div></button>`).join('')}</div>
   <p class="small muted" style="margin-top:10px">${m.d}</p>
  </div>
  <div class="set-grid" style="margin-top:12px">
   <div class="setc card full"><div class="lab"><h4>${ic('clock')}Süre</h4><span class="val" id="durv">${S.dur} sn</span></div>
    <input type="range" min="4" max="30" step="1" value="${S.dur}" id="dur" style="--p:${pct}" aria-label="Süre">
    <div class="ticks"><span>4 sn</span><span>Reels için ideal: 10–15 sn</span><span>30 sn</span></div></div>
   <div class="setc card"><div class="lab"><h4>${ic('res')}Çözünürlük</h4></div>${seg('res',[['480p','480p'],['720p','720p HD'],['1080p','1080p']])}</div>

  </div></div>${sum}</div>`};

V.senaryo=()=>{
 const c=price();
 bar(`<div class="pz"><b>${c} kredi</b> <span class="tag ornek" style="vertical-align:4px;margin-left:2px">örnek</span><span class="ln">Onaylayınca bloke edilir</span></div><button class="btn p" data-a="produce">${ic('check')}Onayla ve üret</button>`);
 const st=STYLES.find(s=>s.id===S.style);
 return {top:topbar('Senaryo','ayarlar'),html:`<div class="fx2"><div>${steps(3)}
  <h1 class="h1">Senaryon <em>hazır</em> ✨</h1>
  <p class="sub">Göz at, değiştirmek istediğin yazıya dokun. Bu adım ücretsiz.</p>

V.uretim=()=>{
 bar('');
 const pct=Math.round(S.prog); const C=2*Math.PI*92; const done=pct>=100;
 const left=Math.max(0,Math.ceil((100-pct)/100*90));
 return {top:topbar('Üretim','panel'),html:`<div class="prod">
  <span class="tag ${done?'ok':'acc'}">${done?'Hazır':S.phase===0?'Sırada':'Üretiliyor'}</span>
  <div class="ring"><svg class="rg" viewBox="0 0 210 210"><defs><linearGradient id="rgg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient></defs>
   <circle cx="105" cy="105" r="92" stroke="rgba(255,255,255,.07)" stroke-width="10" fill="none"/>
   <circle id="rgc" cx="105" cy="105" r="92" stroke="url(#rgg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" style="transition:stroke-dashoffset .4s linear;filter:drop-shadow(0 0 10px rgba(var(--accRGB),.5))"/></svg>
   <div class="ctr"><b id="pnum">%${pct}</b><span id="pleft">${done?'Tamamlandı':'≈ '+left+' sn kaldı'}</span></div></div>
  <h1 class="h1" style="font-size:22px">${done?'Videon hazır! 🎉':'Videon hazırlanıyor'}</h1>
  <p class="sub" style="max-width:36ch">${esc(S.product.title)}</p>
  <div class="card tl" style="margin-top:18px">${PH.map((p,i)=>`<div class="it ${i<S.phase||done?'done':i===S.phase?'now':''}"><span class="bub">${i<S.phase||done?ic('check'):''}</span><div><b>${p[0]}</b><span>${i===2?MODELS.find(x=>x.id===S.model).name+' sahneleri çiziyor':p[1]}</span></div></div>`).join('')}</div>
  ${done?`<a class="btn p" style="margin-top:18px;min-width:260px" href="#/teslim">${ic('eye')}Videoyu izle</a>`:`
  <div class="card notice"><span class="ic">${ic('bell')}</span><div><b style="font-size:14px">Uygulamayı kapatabilirsin</b><p class="small muted">Video hazır olunca sana bildirim göndereceğiz.</p></div></div>
  <a class="btn g" href="#/panel" style="margin-top:6px">Panele dön</a>`}
 </div>`};
};
function runProd(){
 clearInterval(S.timer); S.prog=0; S.phase=0;
 S.timer=setInterval(()=>{
  if(location.hash!=='#/uretim'){clearInterval(S.timer);return}
  S.prog=Math.min(100,S.prog+(S.prog<8?1:S.prog<85?2.2:1.5));
  const ph=S.prog<8?0:S.prog<25?1:S.prog<80?2:S.prog<100?3:4;
  const changed=ph!==S.phase; S.phase=ph;
  if(S.prog>=100){clearInterval(S.timer);render();toast('🎉 Videon hazır!');return}
  if(changed){render();return}
  const C=2*Math.PI*92; const e=document.getElementById('rgc'); if(!e)return;
  e.style.strokeDashoffset=C*(1-S.prog/100);
  document.getElementById('pnum').textContent='%'+Math.round(S.prog);
  document.getElementById('pleft').textContent='≈ '+Math.ceil((100-S.prog)/100*90)+' sn kaldı';
 },220);
}

let last='';
function render(){
 const r=(location.hash.replace('#/','')||'panel').split('?')[0];
 const fn=V[r]||V.panel;
 shell(r);
 const o=fn();
 document.getElementById('top').innerHTML=o.top;
 document.getElementById('view').innerHTML=`<div class="view" ${r===last?'style="animation:none"':''}>${o.html}</div>`;
 if(r!==last) window.scrollTo(0,0);
 last=r;
 bindAfter();
}
function bindAfter(){
 const d=document.getElementById('dur');
 if(d) d.oninput=()=>{S.dur=+d.value;d.style.setProperty('--p',((S.dur-4)/26*100)+'%');document.getElementById('durv').textContent=S.dur+' sn';updPrice(true)};
 document.querySelectorAll('[data-m]').forEach(el=>el.oninput=()=>{const k=el.dataset.m.split('.');if(k.length>1)S[k[0]][k[1]]=el.value;else S[k[0]]=el.value});
 const l=document.getElementById('link'); if(l) l.oninput=()=>S.link=l.value;
 ['file','file2'].forEach(id=>{const f=document.getElementById(id);if(f)f.onchange=()=>{[...f.files].slice(0,6).forEach(file=>{const rd=new FileReader();rd.onload=ev=>{S.uploads.push(ev.target.result);render()};rd.readAsDataURL(file)})}});
}
function updPrice(full){
 const c=price(); const m=MODELS.find(x=>x.id===S.model);
 const b=document.getElementById('barc'); if(b){b.textContent=c+' kredi';b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
 const bl=document.getElementById('barl'); if(bl) bl.textContent=`${m.tier} • ${S.dur} sn • ${S.res}${S.ver>1?' • '+S.ver+' versiyon':''}`;
 const s=document.getElementById('sumc'); if(s){s.firstChild.textContent=c+' '}
 if(full){document.querySelectorAll('.summary .row.between.small').forEach(r=>{if(r.firstChild.textContent==='Süre')r.lastChild.textContent=S.dur+' saniye'})}
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
document.addEventListener('click',e=>{
 if(!e.target.closest('#dev')) document.getElementById('dev').classList.remove('open');
 if(!e.target.closest('#tpick')){const tp=document.getElementById('tpick');tp&&tp.classList.remove('open')}
 const t=e.target.closest('[data-a]'); if(!t) return;
 const a=t.dataset.a, v=t.dataset.v;
 if(a==='tpick'){document.getElementById('tpick').classList.toggle('open');return}
 if(a==='theme'){setTheme(v);render();toast('Tema: '+THEMES.find(x=>x.id===v).n);return}
 if(a==='dev'){document.getElementById('dev').classList.toggle('open');return}
 if(a==='go'){location.hash='#/'+v;return}
 if(a==='tabgo'){S.tab=v;return}
 if(a==='tab'){S.tab=v;render();return}
 if(a==='paste'){S.link='https://www.trendyol.com/gokseramik/el-yapimi-seramik-kupa-okyanus-p-748213';render();return}
 if(a==='fetch'){if(!S.link)S.link='https://www.trendyol.com/gokseramik/el-yapimi-seramik-kupa-okyanus-p-748213';S.fetching=true;S.fetched=false;render();setTimeout(()=>{S.fetching=false;S.fetched=true;if(location.hash==='#/urun')render()},1300);return}
 if(a==='demoup'){S.uploads=['ocean','sand','sage'];S.img=0;render();return}
 if(a==='img'){S.img=+v;render();return}
 if(a==='style'){S.style=v;render();return}
 if(a==='bchip'){S.briefChips=S.briefChips.includes(v)?S.briefChips.filter(x=>x!==v):[...S.briefChips,v];render();return}
 if(a==='listen'){e.stopPropagation();toast('🔊 Ses örneği çalınıyor…');return}
 if(a==='set'){S[t.dataset.k]=v;render();updPrice();return}
 if(a==='subs'){S.subs=!S.subs;render();return}
 if(a==='ver'){S.ver=Math.max(1,Math.min(4,S.ver+ +v));render();updPrice();return}
 if(a==='rewrite'){toast('✍️ Senaryo yeniden yazılıyor…');document.querySelectorAll('.scene').forEach((s,i)=>{s.style.transition='opacity .3s';s.style.opacity=.35;setTimeout(()=>s.style.opacity=1,500+i*150)});return}
 if(a==='produce'){location.hash='#/uretim';return}
 if(a==='regen'){S.curVer=0;location.hash='#/uretim';return}
 if(a==='othermodel'){S.model='eko';location.hash='#/uretim';return}
 if(a==='cver'){S.curVer=+v;render();return}
 if(a==='filter'){S.filter=v;render();return}
 if(a==='bill'){S.billing=v;render();return}
 if(a==='toast'){toast(v);return}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#/uretim'){S.prog=0;S.phase=0;render();runProd()}else render()});
render(); if(location.hash==='#/uretim') runProd();
</script>
